[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # long f-string log lines aren't worth wrapping

[tool.ruff.lint.per-file-ignores]
# load_dotenv()/sys.path must run before the imports that depend on them
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# smartapi-python ships no type stubs — errors here are SDK noise, not real bugs
module = "brokers.*"
ignore_errors = true
